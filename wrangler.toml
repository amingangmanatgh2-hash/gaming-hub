# ─────────────────────────────────────────────────────────────
#  مدار + هم‌کلام | Cloudflare Workers + Durable Objects
#  نام زیر با Worker ازقبل‌متصلِ این مخزن در Cloudflare برابر است.
#  برای نصب تازه در حساب دیگر می‌توانید نام را تغییر دهید؛ در این حالت
#  Service bindingِ CORE در Pages هم باید به همان نام اشاره کند.
# ─────────────────────────────────────────────────────────────
name = "gaming-hub"
main = "worker/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

# ── فایل‌های استاتیک (همان پوشه‌ای که به Pages هم می‌دهید) ──
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
# مسیرهای API و صفحهٔ اتاق (/r/CODE) را خود Worker مدیریت می‌کند
run_worker_first = ["/api/*", "/edge", "/r", "/r/*", "/panel", "/app", "/setup", "/meet"]

# ── اتاق‌ها: هر اتاق یک Durable Object با WebSocket Hibernation ──
# (هاداینیت یعنی وقتی کسی حرف نمی‌زند، سرور هزینه‌ای مصرف نمی‌کند؛
#  پس یک اتاق ۸ ساعته تقریباً رایگان تمام می‌شود.)
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "MARKET"
class_name = "MarketState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2-market"
new_sqlite_classes = ["MarketState"]

# Workers AI is opt-in. After connecting a Cloudflare account, add [ai] and
# binding = "AI" (see docs/DEPLOY-fa.md). Default local dev needs no remote login.

[triggers]
crons = ["0 * * * *"]

[vars]
# پیش‌فرض‌ها (قابل تغییر از داشبورد Cloudflare → Settings → Variables)
ROOM_TTL_HOURS = "8"        # حداکثر عمر اتاق (ساعت) — پیش‌فرض ۸ ساعت
EMPTY_GRACE_SECONDS = "90"  # چند ثانیه بعد از خالی‌شدن، اتاق پاک شود
MAX_PARTICIPANTS = "12"     # سقف اعضا در هر اتاق
# Optional HTTPS endpoint returning {"usdToToman": 93000}. Empty = manually set in /panel.
FX_RATE_URL = ""
# For Pages frontends, set this to the real Worker hostname that serves /edge.
EDGE_HOST = ""
# SETUP_KEY (>=24 chars) and APP_SECRET (>=32 chars) MUST be wrangler secrets, never [vars].

# ── اختیاری: TURN رایگان کلودفلر (۱ ترابایت در ماه) ──
# برای کاربرانی که پشت NAT سخت / CGNAT هستند (اکثر اینترنت‌های موبایل ایران)
# از داشبورد Cloudflare → Realtime → TURN Keys بسازید و این دو مقدار را ست کنید:
#   wrangler secret put TURN_KEY_ID
#   wrangler secret put TURN_KEY_API_TOKEN

[observability]
enabled = true
head_sampling_rate = 1
