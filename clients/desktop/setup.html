<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"><title>تنظیم اپ همراه مدار</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 26% 15%,#26554e,#0a111e 55%);color:#e7f5f1;font:16px Tahoma,Arial,sans-serif;min-height:100vh;display:grid;place-items:center}main{width:min(470px,calc(100% - 30px));border:1px solid #a0e7ce50;border-radius:20px;background:#132330;padding:35px;box-shadow:0 25px 80px #0006}.logo{width:60px;height:60px;border-radius:17px;background:#9be8ce;color:#0c272b;display:grid;place-items:center;font-size:32px;margin-bottom:24px}small{color:#9be8ce;letter-spacing:2px}h1{margin:10px 0 15px;font-size:28px}p{color:#adbfbe;font-size:13px;line-height:2}label{font-size:13px;display:block;margin-top:26px}input{display:block;width:100%;background:#0c1825;color:#fff;border:1px solid #9be8ce66;border-radius:9px;padding:12px;margin-top:9px;direction:ltr;text-align:left;font:14px Arial}button{width:100%;background:#9be8ce;color:#092427;border:0;border-radius:9px;padding:13px;margin-top:17px;cursor:pointer;font-weight:bold;font-size:14px}#error{color:#ffb5b3;font-size:12px;min-height:16px}.note{border-top:1px solid #ffffff22;margin-top:24px;padding-top:14px}</style><script src="setup.js" defer></script></head><body><main><div class="logo">✦</div><small>MADAR / DESKTOP</small><h1>خوش آمدی به مدار.</h1><p>آدرس HTTPS سایتی را که روی Cloudflare منتشر کردی وارد کن. این برنامه داشبورد و کانفیگ را نشان می‌دهد؛ <strong>خودش VPN ویندوز نیست.</strong></p><form id="form"><label>آدرس Worker یا دامنه<input id="origin" type="url" required placeholder="https://your-worker.workers.dev"></label><p id="error" role="alert"></p><button type="submit">ذخیره و رفتن به اپ ↗</button></form><p class="note">برای استفاده از کانفیگ، کلاینت VLESS سازگار را جداگانه نصب کن. آدرس را هر زمان از منوی «مدار» تغییر بده.</p></main></body></html>
