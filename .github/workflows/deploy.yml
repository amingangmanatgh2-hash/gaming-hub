# Manual/Deploy-button deployment. Only works after Cloudflare secrets are configured
# in GitHub and this code is present on the branch dispatched by the button.
name: Deploy Madar Worker

on:
  repository_dispatch:
    types: [deploy, "*"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Deploy site, API and Durable Objects
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Finish one-time setup in your Cloudflare account
        run: echo "After deploy, add SETUP_KEY and APP_SECRET as Worker secrets, then open /setup on the actual workers.dev URL."
