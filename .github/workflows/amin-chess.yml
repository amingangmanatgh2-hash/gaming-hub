name: ساخت APK شطرنج امین

# اجرای خودکار: هر تغییر در پوشه amin-chess-ai یا اجرای دستی
on:
  push:
    branches: [Main, main, master]
    paths: ['amin-chess-ai/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: amin-chess-ai

    steps:
      - name: دریافت سورس پروژه
        uses: actions/checkout@v4

      - name: نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: amin-chess-ai/package.json

      - name: نصب وابستگی‌ها
        run: npm install

      - name: اجرای تست‌ها
        run: npm test

      - name: ساخت نسخه وب
        run: node scripts/build-web.mjs

      - name: همگام‌سازی Capacitor
        run: npx cap sync android

      - name: نصب Gradle 8.5 (سازگار با AGP 8.2)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: نصب Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Android SDK روی رانر ubuntu-latest از پیش نصب است (ANDROID_HOME)
      - name: ساخت Debug APK
        run: |
          cd android
          gradle --version
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-output.log || true
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "### خطای Gradle (۲۰۰ خط آخر)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -200 gradle-output.log >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "APK ساخته نشد — جزئیات در Step Summary بالا" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: آماده‌سازی Keystore امضا (فقط از Secrets)
        if: env.KEYSTORE_BASE64 != ''
        working-directory: amin-chess-ai
        env:
          KEYSTORE_BASE64: ${{ secrets.AMIN_CHESS_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.AMIN_CHESS_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AMIN_CHESS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AMIN_CHESS_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "KEYSTORE_FILE=$(pwd)/release.keystore" >> $GITHUB_ENV

      - name: ساخت Release APK (با Keystore امضا می‌شود؛ بدون آن unsigned)
        working-directory: amin-chess-ai
        run: |
          cd android
          gradle assembleRelease --no-daemon

      - name: ذخیره Debug APK به Artifact
        uses: actions/upload-artifact@v4
        with:
          name: amin-chess-debug-apk
          path: amin-chess-ai/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: ذخیره Release APK به Artifact
        uses: actions/upload-artifact@v4
        with:
          name: amin-chess-release-apk
          path: amin-chess-ai/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: ساخت GitHub Release و پیوست APKها
        if: github.ref == 'refs/heads/Main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: AMIN CHESS AI v1.0.0 — امین چس
          body: |
            ## AMIN CHESS AI — امین چس ♟️
            **«هوشمند بازی کن، حرفه‌ای شطرنج یاد بگیر.»**

            اولین نسخه رسمی اپلیکیشن اندرویدی AMIN CHESS AI.

            ### فایل‌ها
            | فایل | توضیح |
            |---|---|
            | `app-debug.apk` | نسخه Debug — نصب مستقیم روی گوشی (پیشنهادی برای تست) |
            | `app-release-unsigned.apk` | نسخه Release بدون امضا — برای نصب نیاز به امضای مجدد دارد |

            ### نصب
            1. فایل `app-debug.apk` را دانلود کن.
            2. روی گوشی اندرویدی (نسخه ۶ به بالا) باز کن و اجازه نصب از منابع ناشناس را بده.
            3. برنامه کاملاً آفلاین کار می‌کند؛ برای گفت‌وگوی آنلاین با «استاد شطرنج» API خودت را در بخش مدیریت API وارد کن.

            ### امکانات
            - بازی با Stockfish در ۶ سطح، دونفره، تمرین آخر بازی و گشایش
            - تحلیل صفحه، بهترین حرکت، بررسی اشتباهات بازی
            - استاد شطرنج فارسی، ۱۰ درس آموزشی، معماها
            - سکه، فروشگاه، مأموریت‌ها، دستاوردها — همه آفلاین
          files: |
            amin-chess-ai/android/app/build/outputs/apk/debug/*.apk
            amin-chess-ai/android/app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
