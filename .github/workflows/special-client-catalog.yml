name: Refresh SPECIAL CLIENT catalogue
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
  push:
    branches: ['arena/8bcdca13-gaming-hub']
    paths: ['special-client/tools/sync_catalog.py', 'special-client/catalog/sources.json', '.github/workflows/special-client-catalog.yml']
permissions:
  contents: write
concurrency:
  group: special-client-catalog
  cancel-in-progress: false
jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch and validate official metadata
        run: python special-client/tools/sync_catalog.py versions.json
      - name: Publish metadata-only catalogue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=special-client-catalog
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --prerelease --latest=false --title "SPECIAL CLIENT — live metadata catalogue" --notes "Automatically refreshed official version metadata and upstream mod source links. No Minecraft game files or third-party mod binaries are hosted. Daily schedule runs once this workflow is on the default branch."
          fi
          gh release upload "$tag" versions.json special-client/catalog/sources.json --clobber
          python - <<'PY'
          import json
          data = json.load(open("versions.json"))
          with open("catalogue-notes.md", "w") as out:
              out.write("Metadata only. Actual latest official release: **" + data["latest"]["release"] + "**. Entries: " + str(len(data["versions"])) + ".\n\nNo game/mod JARs are mirrored. Daily refresh at 06:17 UTC requires this workflow on the default branch. GitHub may delay scheduled runs.")
          PY
          gh release edit "$tag" --notes-file catalogue-notes.md
