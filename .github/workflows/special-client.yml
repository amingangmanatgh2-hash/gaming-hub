name: SPECIAL CLIENT builds
on:
  workflow_dispatch:
  push:
    paths: ['special-client/**', '.github/workflows/special-client.yml']
  pull_request:
    paths: ['special-client/**', '.github/workflows/special-client.yml']
permissions:
  contents: read
jobs:
  client-mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
      - name: Build and test Fabric mod
        working-directory: special-client/client
        run: gradle --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: SPECIAL_CLIENT_Fabric_1.20.1
          path: special-client/client/build/libs/*.jar
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: special-client/launcher
        run: python -m pip install ".[gui,dev]" pyinstaller pyflakes
      - name: Tests and lint
        working-directory: special-client/launcher
        run: |
          python ../tools/ci_run.py python -m pytest tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/ci_run.py python -m pyflakes special_client tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generate assets and package launcher
        working-directory: special-client
        run: |
          python tools/make_assets.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/ci_run.py pyinstaller packaging/special_client.spec --noconfirm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "dist/SPECIAL_CLIENT/SPECIAL_CLIENT_CLI.exe" --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist/SPECIAL_CLIENT -DestinationPath dist/SPECIAL_CLIENT_Portable.zip
      - name: Build Windows installer
        working-directory: special-client
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw 'Inno Setup 6 not installed on runner' }
          python tools/ci_run.py $iscc packaging/innosetup/SPECIAL_CLIENT.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash dist/SPECIAL_CLIENT_Setup.exe -Algorithm SHA256 | Format-List | Out-File dist/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SPECIAL_CLIENT_Windows
          path: |
            special-client/dist/SPECIAL_CLIENT_Setup.exe
            special-client/dist/SPECIAL_CLIENT_Portable.zip
            special-client/dist/SHA256.txt
          if-no-files-found: error
