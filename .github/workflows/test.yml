# آزمون‌های خودکار روی هر push / pull request
name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: ساخت بستهٔ فرانت
        run: npm run build
      - name: اجرای آزمون‌ها (بازار Worker/DO + سرویس قبلی)
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/madar-tests.log || {
            excerpt=$(grep -A30 '^not ok' /tmp/madar-tests.log | tr '\n' ' ' | cut -c1-3800)
            if [ -z "$excerpt" ]; then excerpt=$(tail -n 30 /tmp/madar-tests.log | tr '\n' ' ' | cut -c1-3800); fi
            echo "::error::$excerpt"
            exit 1
          }
      - name: اعتبارسنجی سورس همراه‌ها و آدرس عمومی Worker
        run: |
          node --check clients/desktop/main.cjs
          node --check clients/desktop/endpoint.cjs
          node --check clients/desktop/preload.cjs
          node --check clients/desktop/make-build-config.cjs
          node --check clients/desktop/verify-build.cjs
          MADAR_WORKER_ORIGIN=https://gaming-hub.account.workers.dev node scripts/validate-worker-origin.cjs
      - name: اعتبارسنجی پیکربندی Worker (dry-run)
        run: npx wrangler deploy --dry-run --outdir=/tmp/dist
