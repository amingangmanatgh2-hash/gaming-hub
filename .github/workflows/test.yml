# آزمون‌های خودکار روی هر push / pull request
name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: ساخت بستهٔ فرانت
        run: npm run build
      - name: اجرای آزمون‌ها (پروتکل + DOM + e2e سیگنالینگ)
        run: npm test
      - name: اعتبارسنجی پیکربندی Worker (dry-run)
        run: npx wrangler deploy --dry-run --outdir=/tmp/dist
