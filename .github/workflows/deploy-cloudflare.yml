# ============================================================
# AMIN AI ULTRA — Deploy to Cloudflare Workers
# ============================================================
# Runs automatically on every push to `Main`, or manually via
# Actions → "Deploy to Cloudflare Workers" → Run workflow.
#
# Required repository configuration (one-time, see README.fa.md §4):
#   Secrets  (https://github.com/<you>/<repo>/settings/secrets/actions):
#     CLOUDFLARE_API_TOKEN    — API token with "Edit Cloudflare Workers" permissions
#     CLOUDFLARE_ACCOUNT_ID   — your account id (from the dashboard sidebar)
#     APP_SECRET              — (recommended) 64-char hex; `openssl rand -hex 32`
#   Variables (https://github.com/<you>/<repo>/settings/variables/actions):
#     CF_D1_DATABASE_ID       — id of the D1 database named `amin-ai-ultra`
#
# The site then lives at:  https://amin-ai-ultra.<your-subdomain>.workers.dev
# ============================================================

name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches: [Main]

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify credentials are configured
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error title=Missing secrets::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set in repo Settings → Secrets and variables → Actions (see README.fa.md)."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Build frontend (Vite → dist/)
        run: npm run build

      - name: Inject D1 database id into wrangler.toml
        env:
          CF_D1_DATABASE_ID: ${{ vars.CF_D1_DATABASE_ID }}
        run: |
          if [ -n "$CF_D1_DATABASE_ID" ]; then
            sed -i "s/^database_id = \".*\"$/database_id = \"$CF_D1_DATABASE_ID\"/" wrangler.toml
            echo "D1 database_id set from repo variable."
          fi
          grep -q "REPLACE_WITH_YOUR_D1_DATABASE_ID" wrangler.toml && {
            echo "::error title=D1 not configured::Create the D1 database (npx wrangler d1 create amin-ai-ultra or the dashboard) and set its id as repo variable CF_D1_DATABASE_ID."
            exit 1
          } || true

      - name: Create R2 bucket if missing
        run: npx wrangler r2 bucket create amin-ai-ultra-assets || echo "Bucket likely exists already — continuing."

      - name: Apply D1 migrations (remote)
        run: npx wrangler d1 migrations apply DB --remote

      - name: Set APP_SECRET (if provided as repo secret)
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
        run: |
          if [ -n "$APP_SECRET" ]; then
            echo "$APP_SECRET" | npx wrangler secret put APP_SECRET
          else
            echo "::warning title=APP_SECRET::Repo secret APP_SECRET not provided. If the Worker has no APP_SECRET yet, set it once with: npx wrangler secret put APP_SECRET"
          fi

      - name: Deploy Worker + Static Assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Deployment summary
        run: |
          echo "✅ Deployed. The app is available at:"
          echo "   https://amin-ai-ultra.<your-workers-subdomain>.workers.dev"
          echo "First visit: open /setup to create the admin account."
