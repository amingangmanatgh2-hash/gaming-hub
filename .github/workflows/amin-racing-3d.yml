name: AMIN RACING 3D (build + emulator check)

# Builds the Android game in amin-racing-3d/ (debug + release APKs).
#  - push / pull request touching amin-racing-3d/**  -> build, upload artifact, emulator smoke test
#  - GitHub Release published with a tag "amin-racing-v*" -> build and attach both APKs to that release
#  - manual run with input release_tag                   -> build and attach both APKs to that (draft) release
#  - push while a draft release "amin-racing-v<versionName>" exists -> APKs are attached to the draft
# Emulator results (screenshots, logcat) are committed back under ci-output/amin-racing-3d/.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Attach the APKs to this release tag (e.g. amin-racing-v1.0.0). Leave empty for a normal build.'
        required: false
        default: ''
  push:
    branches: ['Main', 'arena/c01e8093-gaming-hub']
    paths:
      - 'amin-racing-3d/**'
      - '.github/workflows/amin-racing-3d.yml'
  pull_request:
    paths:
      - 'amin-racing-3d/**'
      - '.github/workflows/amin-racing-3d.yml'
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: amin-racing-3d-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

env:
  RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag || '' }}

jobs:
  build:
    # release events for other projects in this repository are ignored
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'amin-racing-v')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: amin-racing-3d
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK packages
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' > /dev/null
          fi

      - name: Build debug + release APKs
        env:
          AMIN_KEYSTORE_BASE64: ${{ secrets.AMIN_KEYSTORE_BASE64 }}
          AMIN_KEYSTORE_PASSWORD: ${{ secrets.AMIN_KEYSTORE_PASSWORD }}
          AMIN_KEY_ALIAS: ${{ secrets.AMIN_KEY_ALIAS }}
          AMIN_KEY_PASSWORD: ${{ secrets.AMIN_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report build errors
        if: failure() && github.event_name == 'push'
        run: |
          grep -E '^e: |error:|ERROR:|What went wrong|FAILURE|Exception' -A3 build.log | head -150 > errors.txt || true
          head -n 20 errors.txt | while IFS= read -r l; do echo "::error::$l"; done
          mkdir -p ../ci-output/amin-racing-3d
          cp errors.txt ../ci-output/amin-racing-3d/
          tail -n 300 build.log > ../ci-output/amin-racing-3d/build-log-tail.txt
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-output/amin-racing-3d
          git commit -m "ci(amin-racing-3d): build failure log [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done

      - name: Verify APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*versionName *= *"\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # A pushed build fills a *draft* release "amin-racing-v<version>" if one exists, so the
          # release can be checked before it is published.
          if [ "${{ github.event_name }}" = "push" ] && [ -z "$RELEASE_TAG" ]; then
            draft=$(gh release view "amin-racing-v$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null || true)
            if [ "$draft" = "true" ]; then
              RELEASE_TAG="amin-racing-v$VERSION"
              echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
              echo "Draft release $RELEASE_TAG found - APKs will be attached to it."
            fi
          fi
          BT="$ANDROID_HOME/build-tools/35.0.0"
          for apk in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk; do
            ls -la "$apk"
            "$BT/apksigner" verify --verbose "$apk" | head -5
            "$BT/aapt" dump badging "$apk" | grep -E "package:|sdkVersion|targetSdkVersion|application-label|native-code|densities" || true
          done
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/AminRacing3D-${VERSION}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/AminRacing3D-${VERSION}-release.apk"
          (cd dist && sha256sum *.apk | tee SHA256SUMS.txt)
          if [ -n "$RELEASE_TAG" ] && [ "${RELEASE_TAG#amin-racing-v}" != "$VERSION" ]; then
            echo "::warning::Release tag $RELEASE_TAG does not match versionName $VERSION"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: amin-racing-3d-apks
          path: amin-racing-3d/dist/
          retention-days: 30

      - name: Attach APKs to GitHub Release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          have=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '[.assets[].name] | join(" ")')
          echo "Existing assets: $have"
          if [ "${{ github.event_name }}" = "release" ] && echo "$have" | grep -q "release.apk" && echo "$have" | grep -q "debug.apk"; then
            echo "Release already has both APKs (attached before publishing) - keeping them."
          else
            gh release upload "$RELEASE_TAG" dist/*.apk dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[] | "\(.name)  \(.size) bytes"'

      - name: Verify release downloads
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/rel && cd /tmp/rel
          draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)
          if [ "$draft" = "false" ]; then
            # published: download anonymously through the public browser URLs, exactly like a user would
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].url' | while read -r u; do
              echo "GET $u"; curl -fsSL -o "$(basename "$u")" "$u"
            done
          else
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber
          fi
          ls -la
          sha256sum -c SHA256SUMS.txt
          BT="$ANDROID_HOME/build-tools/35.0.0"
          for apk in *.apk; do "$BT/apksigner" verify "$apk" && echo "$apk: signature OK"; done

  emulator:
    needs: build
    # smoke test on pushes and plain manual runs (not for release uploads or PRs from forks)
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_tag == '')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: amin-racing-3d-apks
          path: apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator and capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_4
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash amin-racing-3d/tools/emulator-screenshots.sh "$(ls apks/*-debug.apk | head -1)" ci-output/amin-racing-3d/screens

      - name: Commit report
        if: always()
        run: |
          mkdir -p ci-output/amin-racing-3d amin-racing-3d/docs/screenshots
          cp apks/SHA256SUMS.txt ci-output/amin-racing-3d/ 2>/dev/null || true
          # small JPEG copies for the project README
          command -v convert >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick >/dev/null; } || true
          for f in ci-output/amin-racing-3d/screens/*.png; do
            [ -f "$f" ] || continue
            n=$(basename "$f" .png)
            convert "$f" -resize 50% -strip -quality 82 "amin-racing-3d/docs/screenshots/$n.jpg" || true
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-output/amin-racing-3d amin-racing-3d/docs/screenshots
          git commit -m "ci(amin-racing-3d): emulator screenshots and logcat [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
