name: AMIN RACING 3D (build + emulator check)

# Builds the Android game in amin-racing-3d/ and runs it on an Android emulator to capture
# real screenshots. Results (build log, screenshots, logcat) are committed back to the branch
# under ci-output/amin-racing-3d/ so they can be reviewed without downloading artifacts.
on:
  workflow_dispatch:
  push:
    branches: ['arena/c01e8093-gaming-hub']
    paths:
      - 'amin-racing-3d/**'
      - '.github/workflows/amin-racing-3d.yml'

permissions:
  contents: write

concurrency:
  group: amin-racing-3d-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: amin-racing-3d
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK packages
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' > /dev/null
          fi

      - name: Build debug + release APKs
        run: |
          set -o pipefail
          gradle :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          grep -E '^e: |error:|ERROR:|What went wrong|FAILURE|Exception' -A3 build.log | head -150 > errors.txt || true
          head -n 20 errors.txt | while IFS= read -r l; do echo "::error::$l"; done
          mkdir -p ../ci-output/amin-racing-3d
          cp errors.txt ../ci-output/amin-racing-3d/
          tail -n 300 build.log > ../ci-output/amin-racing-3d/build-log-tail.txt
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-output/amin-racing-3d
          git commit -m "ci(amin-racing-3d): build failure log [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done

      - name: Verify APKs
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          for apk in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk; do
            ls -la "$apk"
            "$BT/apksigner" verify --verbose "$apk" | head -5
            "$BT/aapt" dump badging "$apk" | grep -E "package:|sdkVersion|targetSdkVersion|application-label|native-code|densities" || true
          done
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AminRacing3D-1.0.0-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/AminRacing3D-1.0.0-release.apk
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: amin-racing-3d-apks
          path: amin-racing-3d/dist/
          retention-days: 30

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: amin-racing-3d-apks
          path: apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator and capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_4
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash amin-racing-3d/tools/emulator-screenshots.sh apks/AminRacing3D-1.0.0-debug.apk ci-output/amin-racing-3d/screens

      - name: Commit report
        if: always()
        run: |
          mkdir -p ci-output/amin-racing-3d
          cp apks/SHA256SUMS.txt ci-output/amin-racing-3d/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-output/amin-racing-3d
          git commit -m "ci(amin-racing-3d): emulator screenshots and logcat [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
